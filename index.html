<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/0.8.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.0/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene arjs='detectionMode: mono_and_matrix; matrixCodeType: 3x3;'>
      <a-assets>
        <video
          src="Presentacion.mp4"
          preload="auto"
          id="vid"
          loop
          crossorigin="anonymous"
          webkit-playsinline
          playsinline
          muted>
        </video>
      </a-assets>

      <!-- Camera -->
      <a-marker type="barcode" value="12" id="marker">
        <!-- 3D Object -->
        <a-video
          src="#vid"
          position="0 0.5 0"
          rotation="-90 0 0"
          width="6.6"
          height="2.9">
        </a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const videoEl = document.querySelector('#vid');
      const marker = document.querySelector('#marker');

      marker.addEventListener('markerFound', () => {
        videoEl.play().catch(err => console.warn('No se pudo reproducir:', err));
      });

      marker.addEventListener('markerLost', () => {
        videoEl.pause();
      });

      document.body.addEventListener('click', () => {
        videoEl.play().catch(() => {});
      }, { once: true });

      document.body.addEventListener('touchstart', () => {
        videoEl.play().catch(() => {});
      }, { once: true });
    </script>
  </body>
</html>
